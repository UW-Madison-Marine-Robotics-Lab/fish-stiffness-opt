name: Build simulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        blas: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install OpenBLAS on Ubuntu
        if: runner.os == 'Linux' && matrix.blas == 'ON'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build
        env:
          FISH_SIM_PYTHON: python
        run: ./build_fish_sim.sh -DFISH_SIM_USE_BLAS=${{ matrix.blas }}
      - name: Run simulation without video export
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import runpy
          import numpy as np
          import fish_viz

          fish_viz.viz_q_traj = lambda *args, **kwargs: None
          result = runpy.run_path("simulate_fish.py", run_name="__main__")
          assert np.isfinite(result["q_traj"]).all()
          assert np.isfinite(result["eff"]) and result["eff"] > 0
          PY
